all:
  children:
    containers:
      vars:
        ansible_user: admwazuh
        ansible_ssh_private_key_file: "{{ lookup('env', 'wazuh_build_ssh_key') }}"
        ssh_common_args: '-o StrictHostKeyChecking=no'
        connection: ssh
        host_key_checking: false
      hosts:
        container:
          ansible_host: "{{ lookup('env', 'container_ip') }}"
