name: Test Proxmox API Token

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-pve:
    runs-on: [self-hosted, linux, x64, wazuh, terraform, ansible]
    steps:
      - name: Authenticate and Fetch PVE Cluster Nodes
        env:
          PVE_HOST: ${{ secrets.PM_API_URL }}
          PVE_API_TOKEN: ${{ secrets.TERRAFORM_API_TOK }}
        run: |
          echo "Testing connection to Proxmox VE..."
          curl -X GET --connect-timeout 10 \
            --max-time 30 -sS \
            -w '\nHTTP %{http_code}\n' "$PVE_HOST/nodes" \
            -H "Authorization: PVEAPIToken=$PVE_API_TOKEN" \
            --insecure