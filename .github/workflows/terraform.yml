name: Terraform Deploy

on: workflow_dispatch

jobs:
  terraform:
    runs-on: [self-hosted, linux, x64, wazuh, terraform, ansible]
    env:
      TF_VAR_pve_host: ${{ secrets.PM_API_URL }}
      TF_VAR_terraform_token: ${{ secrets.TERRAFORM_API_TOKEN }}
      TF_VAR_terraform_user: ${{ secrets.PM_API_TOKEN_ID }}
      TF_VAR_terraform_api_key: ${{ secrets.TERRAFORM_API_TOK }}
      TF_VAR_terraform_build_pass: ${{ secrets.WAZUH_BUILD_PASSWORD }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan