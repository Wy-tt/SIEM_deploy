name: ansible-post

on: workflow_dispatch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ansible-lint:
    runs-on: [self-hosted, linux, x64, wazuh, terraform, ansible]
    defaults:
      run:
        working-directory: ./ansible
    env:
      wazuh_build_pass: ${{ secrets.WAZUH_BUILD_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ansible Lint
        run: ansible-lint playbooks/lynis.yml
    
      - name: test ansible inventory
        run: ansible-inventory -i inventory_post.yml --list

  ansible-run:
    runs-on: [self-hosted, linux, x64, wazuh, terraform, ansible]
    needs: ansible-lint
    defaults:
      run:
        working-directory: ./ansible
    env:
      wazuh_build_pass: ${{ secrets.WAZUH_BUILD_PASSWORD }}
      wazuh_build_ssh_key: ${{ secrets.WAZUH_BUILD_PRIVKEY }}
      container_ip: ${{ secrets.STATIC_IP }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ansible Playbook
        shell: bash
        run: |
          key_file="$RUNNER_TEMP/wazuh_build_key"
          umask 077
          printf '%s\n' "$wazuh_build_ssh_key" > "$key_file"
          export wazuh_build_ssh_key="$key_file"
          trap 'rm -f "$key_file"' EXIT
          ansible-playbook -i inventory_post.yml playbooks/lynis.yml
